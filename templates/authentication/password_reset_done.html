{% extends 'base.html' %}
{% block title %}Email Sent - Creative Spark{% endblock %}
{% block non_auth_content %}
<div class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card p-4 text-center">
                    <i class="bi bi-envelope-check text-success fs-1 mb-3"></i>
                    <h3>Check Your Email</h3>
                    <p class="text-muted">We've sent password reset instructions to your email address.</p>
                    <a href="{% url 'login' %}" class="btn btn-warning">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
