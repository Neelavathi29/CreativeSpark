{% extends 'base.html' %}
{% block title %}Login - Creative Spark{% endblock %}
{% block non_auth_content %}
<div class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-lightning-charge-fill auth-icon"></i>
                        <h3>Welcome Back</h3>
                        <p class="text-muted">Sign in to your Creative Spark account</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                        <button type="submit" class="btn btn-warning w-100">Sign In</button>
                        <div class="text-center mt-3">
                            <a href="{% url 'password_reset' %}" class="text-muted">Forgot Password?</a>
                        </div>
                        <hr>
                        <p class="text-center mb-0">Don't have an account? <a href="{% url 'register' %}">Sign Up</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
