{% extends 'base.html' %}
{% load static %}
{% block title %}Create Workspace - Creative Spark{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm glass-card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-folder-plus me-2"></i>Create New Workspace</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Workspace Name</label>
                            <input type="text" name="name" class="form-control" required placeholder="e.g., Q4 Planning">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Description</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="What's this workspace for?"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Related Startup Idea (optional)</label>
                            <select name="idea" class="form-select">
                                <option value="">No specific idea</option>
                                {% for idea in ideas %}
                                <option value="{{ idea.id }}">{{ idea.startup_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-2"></i>Create Workspace
                            </button>
                            <a href="{% url 'workspace_list' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
