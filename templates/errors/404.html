{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Page Not Found" %} - Creative Spark{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <h1 class="display-1 text-muted">404</h1>
    <h2 class="mb-3">{% trans "Page Not Found" %}</h2>
    <p class="lead text-muted mb-4">{% trans "The page you are looking for does not exist or has been moved." %}</p>
    <a href="{% url 'home' %}" class="btn btn-primary btn-lg">
        <i class="bi bi-house-door me-2"></i>{% trans "Return Home" %}
    </a>
</div>
{% endblock %}
