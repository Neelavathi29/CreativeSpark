{% extends 'base.html' %}
{% load static %}
{% block title %}Update KPI - Creative Spark{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="glass-card p-4">
            <h3 class="mb-4"><i class="bi bi-speedometer2 me-2 text-warning"></i>Update KPI Metrics</h3>
            <form method="post">
                {% csrf_token %}
                <div class="row">
                    {% for field in form %}
                    <div class="col-md-6 mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
                    </div>
                    {% endfor %}
                </div>
                <div class="d-flex justify-content-between mt-3">
                    <a href="{% url 'kpi_dashboard' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-warning">Update KPIs</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
